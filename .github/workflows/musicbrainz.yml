name: MusicBrainz Music Acquisition

on:
  workflow_dispatch:

concurrency:
  group: mb-slsk-dl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout MB-slsk-dl
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load runtime configuration
        run: |
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, "scripts")
          from config import integer, string
          values = {
              "GITHUB_LIBRARY_PREFIX": string("library.repo_prefix", default="music-library-"),
              "GITHUB_LIBRARY_START": str(integer("library.start_number", default=1)),
              "GITHUB_LIBRARY_NUMBER_WIDTH": str(integer("library.number_width", default=3)),
              "GITHUB_LIBRARY_SOFT_ROLLOVER_BYTES": str(integer("library.soft_rollover_bytes", default=943718400)),
              "GITHUB_LIBRARY_HARD_ROLLOVER_BYTES": str(integer("library.hard_rollover_bytes", default=1073741824)),
              "GITHUB_MAX_FILE_BYTES": str(integer("library.max_file_bytes", default=104857600)),
              "GITHUB_LIBRARY_ARTWORK_RESERVE_BYTES": str(integer("library.artwork_reserve_bytes", default=2097152)),
              "GITHUB_GIT_DATA_MAX_ATTEMPTS": str(integer("github.git_data_max_attempts", default=5)),
              "GITHUB_FILE_UPLOAD_MAX_ATTEMPTS": str(integer("github.file_upload_max_attempts", default=5)),
              "GITHUB_CHECKPOINT_PUSH_MAX_ATTEMPTS": str(integer("github.checkpoint_push_max_attempts", default=3)),
              "MUSICBRAINZ_REQUEST_MAX_ATTEMPTS": str(integer("musicbrainz.request_max_attempts", default=5)),
              "GITHUB_REQUEST_TIMEOUT_SECONDS": str(integer("github.request_timeout_seconds", default=60)),
              "SLSKD_SEARCH_TIMEOUT_MS": str(integer("soulseek.search_timeout_ms", default=12000)),
              "SLSKD_SEARCH_WAIT_SECONDS": str(integer("soulseek.search_wait_seconds", default=20)),
              "SLSKD_RESPONSE_LIMIT": str(integer("soulseek.response_limit", default=100)),
              "SLSKD_FILE_LIMIT": str(integer("soulseek.file_limit", default=10000)),
              "SLSKD_SEARCH_MAX_ATTEMPTS": str(integer("soulseek.search_max_attempts", default=5)),
              "SLSKD_ALBUM_YEAR_ATTEMPTS": str(integer("soulseek.album_year_attempts", default=3)),
              "SLSKD_DOWNLOAD_SLOTS": str(integer("soulseek.download_slots", default=8)),
              "SOULSEEK_DOWNLOAD_DIR": string("download.root", default="/home/runner/music-downloads"),
              "SOULSEEK_INCOMPLETE_DIR": string("download.incomplete_root", default="/home/runner/music-downloads-incomplete"),
              "SOULSEEK_POLL_SECONDS": str(integer("download.poll_seconds", default=5)),
              "SOULSEEK_TIMEOUT_SECONDS": str(integer("download.timeout_seconds", default=3600)),
              "SOULSEEK_ZERO_SPEED_SECONDS": str(integer("download.zero_speed_seconds", default=30)),
              "SOULSEEK_SLOW_USER_SPEED_BYTES": str(integer("download.slow_user_speed_bytes_per_second", default=102400)),
              "SOULSEEK_SLOW_USER_STRIKES": str(integer("download.slow_user_strikes", default=3)),
              "SOULSEEK_TRANSFER_FAILURE_STRIKES": str(integer("download.transfer_failure_strikes", default=2)),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          PY

      - name: Resolve MusicBrainz releases
        run: |
          python scripts/main.py

      - name: Remove queued albums
        env:
          GIT_PAT: ${{ secrets.GIT_PAT }}
        run: |
          python scripts/remove_albums.py

      - name: Start slskd
        env:
          SOULSEEK_USERNAME: ${{ secrets.SOULSEEK_USERNAME }}
          SOULSEEK_PASSWORD: ${{ secrets.SOULSEEK_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/slskd"
          mkdir -p "$SOULSEEK_DOWNLOAD_DIR"
          mkdir -p "$SOULSEEK_INCOMPLETE_DIR"

          docker run \
            --detach \
            --name slskd \
            --publish 127.0.0.1:5030:5030 \
            --publish 127.0.0.1:50300:50300 \
            --env "SLSKD_SLSK_USERNAME=$SOULSEEK_USERNAME" \
            --env "SLSKD_SLSK_PASSWORD=$SOULSEEK_PASSWORD" \
            --env "SLSKD_NO_AUTH=true" \
            --env "SLSKD_REMOTE_CONFIGURATION=false" \
            --env "SLSKD_DOWNLOAD_SLOTS=$SLSKD_DOWNLOAD_SLOTS" \
            --env "SLSKD_DOWNLOADS_DIR=/downloads" \
            --env "SLSKD_INCOMPLETE_DIR=/incomplete" \
            --volume "$RUNNER_TEMP/slskd:/app" \
            --volume "$SOULSEEK_DOWNLOAD_DIR:/downloads" \
            --volume "$SOULSEEK_INCOMPLETE_DIR:/incomplete" \
            slskd/slskd:latest

      - name: Wait for slskd
        run: |
          echo "Waiting for slskd HTTP API..."

          for i in {1..60}; do
            if curl --silent --fail \
              http://127.0.0.1:5030/api/v0/application \
              >/dev/null 2>&1; then
              echo "slskd HTTP API is ready."
              break
            fi

            if [ "$i" -eq 60 ]; then
              echo "slskd failed to become ready."
              docker logs slskd
              exit 1
            fi

            sleep 2
          done

          echo "Waiting for Soulseek connection..."

          for i in {1..90}; do
            if docker logs slskd 2>&1 | grep -qi \
              "logged in to the Soulseek server"; then
              echo "slskd is logged into Soulseek."
              break
            fi

            if [ "$i" -eq 90 ]; then
              echo "slskd did not log into Soulseek."
              docker logs slskd
              exit 1
            fi

            sleep 2
          done

      - name: Process releases independently
        env:
          SLSKD_URL: http://127.0.0.1:5030
          GIT_PAT: ${{ secrets.GIT_PAT }}
        run: |
          python scripts/process_releases.py

      - name: Install OneTagger CLI
        run: |
          mkdir -p "$RUNNER_TEMP/onetagger"
          curl --fail --location \
            https://github.com/Marekkon5/onetagger/releases/download/1.7.0/OneTagger-linux-cli.tar.gz \
            --output "$RUNNER_TEMP/onetagger-cli.tar.gz"
          tar -xzf "$RUNNER_TEMP/onetagger-cli.tar.gz" -C "$RUNNER_TEMP/onetagger"

          ONETAGGER_EXECUTABLE="$(find "$RUNNER_TEMP/onetagger" -type f -iname 'onetagger-cli' -print -quit)"
          if [ -z "$ONETAGGER_EXECUTABLE" ]; then
            echo "OneTagger CLI executable was not found in the release archive."
            find "$RUNNER_TEMP/onetagger" -maxdepth 2 -type f -print
            exit 1
          fi

          cp "$ONETAGGER_EXECUTABLE" "$RUNNER_TEMP/onetagger-cli"
          chmod +x "$RUNNER_TEMP/onetagger-cli"
          "$RUNNER_TEMP/onetagger-cli" --version

      - name: Enrich committed music with OneTagger
        continue-on-error: true
        env:
          GIT_PAT: ${{ secrets.GIT_PAT }}
          ONETAGGER_BIN: ${{ runner.temp }}/onetagger-cli
          ONETAGGER_CONFIG: ${{ github.workspace }}/onetagger/autotagger.json
        run: |
          python scripts/metadata.py

      - name: Collect OneTagger failed-song playlists
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/onetagger-failures"
          found=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            found=1
            base="$(basename "$file")"
            cp "$file" "$RUNNER_TEMP/onetagger-failures/$base"
            echo "Found failed-song playlist: $file"
          done < <(find "$HOME" "$RUNNER_TEMP" "$GITHUB_WORKSPACE" -type f -iname 'failed-*.m3u' -print 2>/dev/null | sort -u)
          if [ "$found" -eq 0 ]; then
            echo "No OneTagger failed-song playlists found."
          fi

      - name: Upload OneTagger failed-song playlists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onetagger-failed-songs-${{ github.run_id }}
          path: ${{ runner.temp }}/onetagger-failures
          if-no-files-found: ignore
          retention-days: 30

      - name: Diagnostic state summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("state/tracks.json")

          if not path.exists():
              print("tracks.json does not exist.")
              raise SystemExit(0)

          data = json.loads(path.read_text())
          tracks = data.get("tracks", [])
          statuses = {}

          for track in tracks:
              metadata = track.get("metadata", {})
              acquisition = track.get("acquisition", {})
              if not isinstance(acquisition, dict):
                  acquisition = {}
              status = acquisition.get("status", "unknown")
              statuses[status] = statuses.get(status, 0) + 1

              print()
              print(
                  f"{metadata.get('artist', '?')} - "
                  f"{metadata.get('title', '?')}"
              )
              print(f"Status: {status}")

              library = acquisition.get("library")
              if library:
                  print(f"Library: {library.get('repo')}")
                  print(f"Library path: {library.get('path')}")

          print()
          print("=== Status summary ===")
          for status, count in sorted(statuses.items()):
              print(f"{status}: {count}")
          PY

      - name: Show slskd logs on failure
        if: failure()
        run: |
          docker logs slskd || true

      - name: Stop slskd
        if: always()
        run: |
          docker rm --force slskd || true
